 auth_satanic: "Satanisch"
 auth_satanic_desc: "Diese Regierung wird von einer einzigen Person regiert, die auf Lebenszeit absolute Macht besitzt."
 civic_satanism: "Satanismus"
 civic_satanism_desc: "Diese Gesellschaft ist nach den Prinzipien von Macht und Eigennutz organisiert."
 civic_satanism_effects: "§E$civic_satanism$§! Bürgerkunde-Effekte:\n£influence£ Einfluss durch das Säubern von Pops: §G+0.5§!\n£worker£ Arbeiter-Pop-Ressourcen-Output: §G+10%§!"
