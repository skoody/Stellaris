 # Ethics
 ethic_satan: "Satan"
 ethic_satan_desc: "Diese Gesellschaft glaubt, dass Macht und Eigennutz die ultimativen Tugenden sind, und setzt auf Ehrgeiz und Herrschaft, um ihre Ziele zu erreichen."
 ethic_fanatic_satan: "Fanatischer Satan"
 ethic_fanatic_satan_desc: "Für diese Gesellschaft ist das Streben nach absoluter Macht die einzige Wahrheit. Alle Handlungen sind im Namen von Stärke und persönlichem Gewinn gerechtfertigt, und die Schwachen sind dazu bestimmt, den Starken zu dienen."
