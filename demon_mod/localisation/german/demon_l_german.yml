 gov_satanism_desc: "Eine Regierung, die von einem Hohepriester oder einer Hohepriesterin auf Lebenszeit regiert wird."

 # Origin
 origin_demon: "Dämonischer Ursprung"
 origin_demon_desc: "Diese Spezies ist aus den feurigen Tiefen einer vulkanischen Welt aufgestiegen und ist von Natur aus an extreme Hitze und höllische Landschaften angepasst."
